kind = "web"
previewPath = "/"
title = "Gestion des Missions - SOMELEC"
version = "1.0.0"
id = "artifacts/missions-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18483

[services.development]
run = "pnpm --filter @workspace/missions-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/missions-app", "run", "build" ]
publicDir = "artifacts/missions-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18483"
BASE_PATH = "/"
